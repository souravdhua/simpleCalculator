<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculator</title>
  </head>
  <body>
    <h1 id="display">Display</h1>
    <div id="keypad">
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <!-- <button id="clear">Clear</button> -->
      <button id="clr">AC</button>
      <button>0</button>

      <button>.</button>
    </div>
    <div id="ops">
      <button>%ge</button>
      <button>+</button>
      <button>-</button>
      <button>*</button>
      <button>/</button>
      <button>power</button>
      <button>rem</button>
      <button>root</button>
      <!-- <button>sq</button> -->
    </div>

    <button id="equal">=</button>
    <script src="./calcul.js"></script>
  </body>
</html>
